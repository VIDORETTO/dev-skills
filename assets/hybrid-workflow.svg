<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do Hybrid Development Kit</title>
  <desc id="desc">Uma jornada visual que conecta descoberta, especificação, planejamento, fatiamento, implementação, verificação, revisão e retomada.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="100" x2="1120" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="nodeOne" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="nodeTwo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0891B2"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="nodeThree" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="30" r="150" fill="#7C3AED" fill-opacity="0.12"/>
  <circle cx="110" cy="420" r="190" fill="#06B6D4" fill-opacity="0.08"/>

  <text x="70" y="62" fill="#A78BFA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">HYBRID DEVELOPMENT KIT</text>
  <text x="70" y="104" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="750">Da intenção à evidência</text>
  <text x="70" y="134" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Contexto suficiente para decidir. Artefatos claros para executar. Provas para retomar.</text>

  <path d="M242 224H270" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M472 224H500" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M702 224H730" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M932 224H960" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="174" width="172" height="100" rx="18" fill="url(#nodeOne)"/>
    <rect x="300" y="174" width="172" height="100" rx="18" fill="url(#nodeOne)"/>
    <rect x="530" y="174" width="172" height="100" rx="18" fill="url(#nodeTwo)"/>
    <rect x="760" y="174" width="172" height="100" rx="18" fill="url(#nodeTwo)"/>
    <rect x="990" y="174" width="140" height="100" rx="18" fill="url(#nodeThree)"/>
  </g>

  <text x="156" y="214" text-anchor="middle" fill="#EDE9FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">01</text>
  <text x="156" y="240" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">Descobrir</text>
  <text x="156" y="260" text-anchor="middle" fill="#DDD6FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">problema e limites</text>

  <text x="386" y="214" text-anchor="middle" fill="#EDE9FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">02</text>
  <text x="386" y="240" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">Especificar</text>
  <text x="386" y="260" text-anchor="middle" fill="#DDD6FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">contrato e aceites</text>

  <text x="616" y="214" text-anchor="middle" fill="#CFFAFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">03</text>
  <text x="616" y="240" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">Planejar</text>
  <text x="616" y="260" text-anchor="middle" fill="#CFFAFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">módulos e seams</text>

  <text x="846" y="214" text-anchor="middle" fill="#CFFAFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">04</text>
  <text x="846" y="240" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">Fatiar</text>
  <text x="846" y="260" text-anchor="middle" fill="#CFFAFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">tickets verticais</text>

  <text x="1060" y="214" text-anchor="middle" fill="#D1FAE5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">05</text>
  <text x="1060" y="240" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">Executar</text>
  <text x="1060" y="260" text-anchor="middle" fill="#D1FAE5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">com evidência</text>

  <path d="M1060 294V337H616" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" marker-end="url(#arrow)"/>
  <circle cx="1060" cy="294" r="5" fill="#34D399"/>

  <text x="70" y="354" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">RETOMADA CONTÍNUA</text>
  <text x="70" y="382" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">checkpoint</text>
  <text x="225" y="382" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">•</text>
  <text x="249" y="382" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">fingerprint</text>
  <text x="365" y="382" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">•</text>
  <text x="389" y="382" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">revisão</text>
  <text x="480" y="382" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">•</text>
  <text x="504" y="382" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">convergência</text>

  <rect x="830" y="350" width="300" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="858" cy="372" r="6" fill="#34D399"/>
  <text x="876" y="378" fill="#D1FAE5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">estado local, prova observável</text>
</svg>
